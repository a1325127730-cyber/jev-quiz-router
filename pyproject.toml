[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-quiz-router"
version = "0.1.0"
description = "Jev-first, reasoning-model-fallback automated quiz answering system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CGF" }]
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "streamlit>=1.39,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[project.scripts]
jev-quiz = "quiz_router.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quiz_router"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Provider calls are isolated per question; broad catches intentionally keep a
# single malformed response or network error from aborting an entire question bank.
ignore = ["BLE001"]
